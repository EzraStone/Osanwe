name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: dependency-free interface tests
        run: node --test internal/ui/test/*.test.js

      - name: interface syntax
        run: node --check internal/ui/assets/app.js

      - name: static beta website
        run: python3 -m unittest discover -s tools -p 'test_site.py' -v

      - name: public beta form disclosures
        run: python3 -m unittest discover -s tools -p 'test_beta_forms.py' -v

      - name: immutable workflow dependencies
        run: python3 -m unittest discover -s tools -p 'test_workflows.py' -v

      - name: desktop packaging policy
        run: python3 -m unittest discover -s tools -p 'test_packaging.py' -v

      - name: launcher and enrollment-file syntax
        run: |
          bash -n packaging/client/start-osanwe.sh
          bash -n "packaging/client/Start Osanwe.command"
          python3 -m json.tool packaging/client/osanwe.example.json >/dev/null

  phase0-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-phase0.txt

      - name: install Phase 0 dependency
        run: python -m pip install -r tools/requirements-phase0.txt

      - name: provider adapter fixtures
        run: python tools/phase0_latency.py --self-test

      - name: relay authentication, allowlist, and tunnel tests
        run: python -m unittest discover -s tools -p 'test_phase0_tools.py' -v

  windows-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: client packages
        run: go test ./cmd/bearer ./internal/bearer ./internal/ui ./internal/version

      - name: unsupported operator state fails closed
        run: go test ./internal/mint -run '^(TestWindowsSpentStoreFailsClosed|TestInviteModeFailsClosedOnUnsupportedPlatforms)$' -count=1

      - name: client executable
        run: go build -trimpath -o bearer.exe ./cmd/bearer

      - name: Windows launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath 'packaging/client/start-osanwe.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The first beta client is downloaded, not built by its user. Keep the
      # desktop targets compiling on every change even though only Linux runs
      # the full daemon demo suite here.
      - name: cross-build desktop client
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/bearer.exe ./cmd/bearer
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/bearer-darwin-amd64 ./cmd/bearer
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/bearer-darwin-arm64 ./cmd/bearer

      # The relay pumps bytes between goroutines; run tests under -race.
      - name: test
        run: go test -race ./...

      # CIRCL carries the official RFC 9474 vectors. Run the pinned module's
      # vector suite as well as Osanwe's integration/interoperability tests.
      - name: RFC 9474 vectors
        run: go test github.com/cloudflare/circl/blindsign/blindrsa

      # A normal unit-test run executes only the seed corpus. Spend a bounded
      # interval exploring the token parser on every change as well.
      - name: token parser fuzzing
        run: go test ./internal/mint -run '^$' -fuzz '^FuzzParseTokenCanonical$' -fuzztime 10s

      # The demos are the only thing that exercises the daemons as a user runs
      # them, wired together over real sockets. run.sh went unnoticed-broken
      # for several commits because a log message was renamed and nothing was
      # watching, so they are checked here rather than by remembering to.
      - name: demo — relay carries what it cannot read
        run: ./demo/run.sh

      - name: demo — buy a token, spend it, get an answer
        run: ./demo/tokens.sh

      # What one token buys. The unit tests assert each refusal, but only this
      # counts the wallet across all of them, which is what proves the policy
      # check runs before redemption rather than after it. That ordering is the
      # difference between a malformed request being refused and a malformed
      # request being refused after taking the user's money.
      - name: demo — a token buys one inference request and nothing else
        run: |
          ./demo/ui.sh > /tmp/ui.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/_osanwe/status && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8080/_osanwe/status; then
            echo "the demo stack never came up:"; cat /tmp/ui.log; exit 1
          fi
          ./demo/harden.sh
