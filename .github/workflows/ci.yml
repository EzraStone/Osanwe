name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: dependency-free interface tests
        run: node --test internal/ui/test/*.test.js

      - name: interface syntax
        run: node --check internal/ui/assets/app.js

  phase0-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-phase0.txt

      - name: install Phase 0 dependency
        run: python -m pip install -r tools/requirements-phase0.txt

      - name: provider adapter fixtures
        run: python tools/phase0_latency.py --self-test

      - name: relay authentication, allowlist, and tunnel tests
        run: python -m unittest discover -s tools -p 'test_phase0_tools.py' -v

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The relay pumps bytes between goroutines; run tests under -race.
      - name: test
        run: go test -race ./...

      # CIRCL carries the official RFC 9474 vectors. Run the pinned module's
      # vector suite as well as Osanwe's integration/interoperability tests.
      - name: RFC 9474 vectors
        run: go test github.com/cloudflare/circl/blindsign/blindrsa

      # A normal unit-test run executes only the seed corpus. Spend a bounded
      # interval exploring the token parser on every change as well.
      - name: token parser fuzzing
        run: go test ./internal/mint -run '^$' -fuzz '^FuzzParseTokenCanonical$' -fuzztime 10s

      # The demos are the only thing that exercises the daemons as a user runs
      # them, wired together over real sockets. run.sh went unnoticed-broken
      # for several commits because a log message was renamed and nothing was
      # watching, so they are checked here rather than by remembering to.
      - name: demo — relay carries what it cannot read
        run: ./demo/run.sh

      - name: demo — buy a token, spend it, get an answer
        run: ./demo/tokens.sh

      # What one token buys. The unit tests assert each refusal, but only this
      # counts the wallet across all of them, which is what proves the policy
      # check runs before redemption rather than after it. That ordering is the
      # difference between a malformed request being refused and a malformed
      # request being refused after taking the user's money.
      - name: demo — a token buys one inference request and nothing else
        run: |
          ./demo/ui.sh > /tmp/ui.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/_osanwe/status && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8080/_osanwe/status; then
            echo "the demo stack never came up:"; cat /tmp/ui.log; exit 1
          fi
          ./demo/harden.sh
