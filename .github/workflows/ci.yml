name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The relay pumps bytes between goroutines; run tests under -race.
      - name: test
        run: go test -race ./...
