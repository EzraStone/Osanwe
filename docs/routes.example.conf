# A route table: which model goes to which provider.
#
#   mithlond -routes routes.conf
#
# Four whitespace-separated fields per line:
#
#   model      the name a client asks for
#   style      how the provider wants its credential:
#                anthropic  ->  x-api-key: KEY
#                openai     ->  authorization: Bearer KEY
#              nearly every hosted API is one of these two
#   upstream   the provider's base URL, https only
#   env var    where to read the credential from
#
# The last field names an environment variable and never the key itself. A
# file like this belongs in version control; a key in it is a key published.
#
# A model with no line here is refused rather than forwarded, so a typo costs
# nothing instead of spending a token to reach a provider that has never heard
# of the name.

# model                       style      upstream                        credential
claude-sonnet-5               anthropic  https://api.anthropic.com       ANTHROPIC_API_KEY
claude-opus-5                 anthropic  https://api.anthropic.com       ANTHROPIC_API_KEY
claude-haiku-4-5-20251001     anthropic  https://api.anthropic.com       ANTHROPIC_API_KEY

# Anything OpenAI-compatible uses the same style, differing only in base URL.
# gpt-4o-mini                 openai     https://api.openai.com          OPENAI_API_KEY
# deepseek-chat               openai     https://api.deepseek.com        DEEPSEEK_API_KEY
# llama-3.1-8b-instant        openai     https://api.groq.com/openai     GROQ_API_KEY

# Google's API is deliberately absent. It puts the model in the URL path
# rather than the body, so it needs more than a header swap and is not
# supported yet rather than half-supported.
