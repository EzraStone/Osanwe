# A route table with one free provider, for trying this without spending money.
#
#   export GROQ_API_KEY=gsk_...
#   ./demo/ui.sh docs/routes.groq.conf
#
# Groq's free tier needs no card and speaks the OpenAI format, so it fits the
# route table with no code change. It is rate limited, which does not matter
# for trying things by hand.
#
# Model names change. To see what your key can actually reach:
#
#   curl -s https://api.groq.com/openai/v1/models \
#     -H "authorization: Bearer $GROQ_API_KEY" | grep '"id"'
#
# If a name below is gone, replace it with one from that list.

# model                    style   upstream                     credential
llama-3.1-8b-instant       openai  https://api.groq.com/openai  GROQ_API_KEY
llama-3.3-70b-versatile    openai  https://api.groq.com/openai  GROQ_API_KEY
