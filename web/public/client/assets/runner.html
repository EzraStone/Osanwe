<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osanwë sandbox</title>
<style>
:root{color-scheme:light; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%; height:100%; min-height:100%; margin:0}
body{overflow:auto; background:#fff; color:#1c1a17}
#previewRoot{width:100%; min-height:100%}
.empty{margin:0; padding:1rem; color:#6b6459; font-size:13px; line-height:1.5}
.html-source{margin:0; padding:1rem; font-size:13px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere}
.worker-view{padding:1rem; background:#11110f; color:#ebe7df; font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.worker-output{overflow:hidden; border:1px solid #35322b; border-radius:9px; background:#171613}
.output-heading{padding:.65rem .8rem; border-bottom:1px solid #35322b; color:#d3ab6a; font:600 11px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:.09em; text-transform:uppercase}
.output-lines{display:grid; min-height:8rem; align-content:start}
.output-empty{padding:.8rem; color:#9e9688; font-size:12px}
.output-line{display:grid; grid-template-columns:4.5rem minmax(0,1fr); gap:.7rem; padding:.5rem .8rem; border-bottom:1px solid #282620; font-size:12px; line-height:1.55}
.output-line:last-child{border-bottom:0}
.output-kind{color:#a9a092; font-size:10px; font-weight:700; letter-spacing:.06em}
.output-text{min-width:0; overflow-wrap:anywhere; white-space:pre-wrap}
.output-error .output-kind{color:#df776b}
.output-pass .output-kind{color:#8dc38a}
.output-fail .output-kind{color:#ff8174}
.output-complete .output-kind{color:#d3ab6a}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important}}
</style>
</head>
<body>
<main id="previewRoot">
  <p class="empty">JavaScript runs in a disposable worker. HTML is shown as source while interactive previews are paused.</p>
</main>
<script>
const root = document.getElementById("previewRoot");
const parentWindow = window.parent;
const startupChannel = new URLSearchParams(window.location.search).get("run") || "";
const workerKinds = new Set(["log", "info", "warn", "error", "test", "complete"]);
let channel = "";
let worker = null;
let workerURL = "";
let timeout = null;
let outputList = null;

function supportedNetworkBrowser() {
  const match = navigator.userAgent.match(/(?:Chrome|Chromium|Edg)\/(\d+)/);
  return Boolean(match && Number(match[1]) >= 152);
}

const networkIsolationReady = supportedNetworkBrowser();

const workerSource = `
(() => {
  "use strict";
  const send = self.postMessage.bind(self);
  let token = "";
  let tests = [];
  function valueText(value) {
    if (typeof value === "string") return value;
    if (value instanceof Error) return value.stack || value.message;
    try { return JSON.stringify(value); } catch (_) { return String(value); }
  }
  self.onmessage = async (event) => {
    const message = event.data;
    if (!message || message.type !== "execute" || typeof message.code !== "string" || typeof message.token !== "string") return;
    token = message.token;
    tests = [];
    const emit = (kind, text, detail = {}) => send({ token, kind, text: String(text).slice(0, 12000), ...detail });
    self.console = Object.freeze({
      log: (...values) => emit("log", values.map(valueText).join(" ")),
      info: (...values) => emit("info", values.map(valueText).join(" ")),
      warn: (...values) => emit("warn", values.map(valueText).join(" ")),
      error: (...values) => emit("error", values.map(valueText).join(" ")),
    });
    self.test = (name, fn) => {
      if (typeof name !== "string" || typeof fn !== "function") throw new TypeError("test(name, fn) is required");
      tests.push({ name: name.slice(0, 160), fn });
    };
    self.assert = (condition, message = "assertion failed") => {
      if (!condition) throw new Error(String(message));
    };
    self.fetch = () => Promise.reject(new Error("Network access is disabled in this sandbox."));
    self.XMLHttpRequest = undefined;
    self.WebSocket = undefined;
    self.EventSource = undefined;
    self.WebTransport = undefined;
    self.RTCPeerConnection = undefined;
    self.webkitRTCPeerConnection = undefined;
    self.Worker = undefined;
    self.SharedWorker = undefined;
    self.importScripts = undefined;
    let topLevelFailed = false;
    try {
      const execute = new Function("\\\"use strict\\\"; return (async () => {\\n" + message.code + "\\n})();");
      await execute();
    } catch (error) {
      topLevelFailed = true;
      emit("error", valueText(error));
    }
    let passed = 0;
    let failed = 0;
    if (!topLevelFailed) {
      for (const item of tests) {
        try {
          await item.fn();
          passed += 1;
          emit("test", "PASS " + item.name, { passed: true });
        } catch (error) {
          failed += 1;
          emit("test", "FAIL " + item.name + ": " + valueText(error), { passed: false });
        }
      }
    }
    emit("complete", tests.length ? passed + " passed, " + failed + " failed" : (topLevelFailed ? "Run failed" : "Run completed"), { passed, failed, testCount: tests.length });
  };
})();
`;

function send(kind, text, detail = {}) {
  if (!channel) return;
  parentWindow.postMessage({ type: "osanwe-runner", channel, kind, text, ...detail }, "*");
}

function sendControl(action) {
  if (!channel) return;
  parentWindow.postMessage({ type: "osanwe-runner-control", channel, action }, "*");
}

function revokeWorkerURL() {
  if (!workerURL) return;
  URL.revokeObjectURL(workerURL);
  workerURL = "";
}

function stopWorker() {
  if (timeout) window.clearTimeout(timeout);
  timeout = null;
  if (worker) worker.terminate();
  worker = null;
  revokeWorkerURL();
}

function stopAll() {
  stopWorker();
}

function beginWorkerOutput() {
  root.className = "worker-view";
  root.textContent = "";
  const panel = document.createElement("section");
  panel.className = "worker-output";
  panel.setAttribute("aria-label", "JavaScript execution output");
  const heading = document.createElement("div");
  heading.className = "output-heading";
  heading.textContent = "JavaScript output";
  outputList = document.createElement("div");
  outputList.className = "output-lines";
  const waiting = document.createElement("div");
  waiting.className = "output-empty";
  waiting.textContent = "Running in a disposable worker…";
  outputList.appendChild(waiting);
  panel.append(heading, outputList);
  root.appendChild(panel);
}

function appendWorkerOutput(kind, text, detail = {}) {
  if (!outputList) beginWorkerOutput();
  const waiting = outputList.querySelector(".output-empty");
  if (waiting) waiting.remove();
  const row = document.createElement("div");
  row.className = "output-line output-" + (workerKinds.has(kind) ? kind : "info");
  if (kind === "test") row.classList.add(detail.passed ? "output-pass" : "output-fail");
  const label = document.createElement("span");
  label.className = "output-kind";
  label.textContent = kind === "test" ? (detail.passed ? "PASS" : "FAIL") : kind.toUpperCase();
  const value = document.createElement("span");
  value.className = "output-text";
  value.textContent = String(text).slice(0, 12000);
  row.append(label, value);
  outputList.appendChild(row);
  while (outputList.childElementCount > 200) outputList.firstElementChild.remove();
}

function publishWorkerOutput(kind, text, detail = {}) {
  appendWorkerOutput(kind, text, detail);
  send(kind, text, detail);
}

function runJavaScript(code) {
  stopAll();
  beginWorkerOutput();
  workerURL = URL.createObjectURL(new Blob([workerSource], { type: "text/javascript" }));
  const workerToken = crypto.randomUUID();
  worker = new Worker(workerURL);
  // The worker has already consumed the URL; retaining it would only leak the
  // generated source for the rest of the page lifetime.
  revokeWorkerURL();
  worker.onmessage = (event) => {
    const message = event.data;
    if (!message || message.token !== workerToken || !workerKinds.has(message.kind)) return;
    const detail = { passed: message.passed, failed: message.failed, testCount: message.testCount };
    publishWorkerOutput(message.kind, message.text || "", detail);
    if (message.kind === "complete") stopWorker();
  };
  worker.onerror = (event) => {
    event.preventDefault();
    publishWorkerOutput("error", event.message || "The JavaScript worker failed.");
    publishWorkerOutput("complete", "Run failed", { passed: 0, failed: 0, testCount: 0 });
    stopWorker();
  };
  worker.postMessage({ type: "execute", token: workerToken, code });
  timeout = window.setTimeout(() => {
    publishWorkerOutput("error", "Stopped after 2.5 seconds. The code may contain an infinite loop or a long-running task.");
    publishWorkerOutput("complete", "Timed out", { passed: 0, failed: 0, testCount: 0, timedOut: true });
    stopWorker();
  }, 2500);
}

// Do not parse generated markup or insert it into an executable document.
// This is a source-only fallback, not a repaired interactive HTML sandbox.
function previewHTML(code) {
  stopAll();
  outputList = null;
  root.className = "worker-view";
  root.textContent = "";
  const note = document.createElement("p");
  note.className = "empty";
  note.textContent = "HTML source only. Interactive previews are paused for a browser safety issue. Your code is still available to edit and copy.";
  const source = document.createElement("pre");
  source.className = "html-source";
  source.setAttribute("aria-label", "Generated HTML source");
  source.textContent = code;
  root.append(note, source);
  send("preview", "HTML shown as source. Interactive execution is paused.");
  send("complete", "HTML source displayed. No generated HTML or scripts were executed.", {
    passed: 0, failed: 0, testCount: 0, sourceOnly: true,
  });
}

window.addEventListener("message", (event) => {
  const message = event.data;
  // Only the credential-bearing parent may start a run.
  if (event.source !== parentWindow || !message) return;
  if (message.type === "osanwe-runner-capabilities") {
    parentWindow.postMessage({ type: "osanwe-runner-ready", channel: startupChannel, networkIsolation: networkIsolationReady, htmlPreview: "source-only" }, "*");
    return;
  }
  if (message.type !== "osanwe-run"
      || typeof message.channel !== "string" || typeof message.code !== "string") return;
  channel = message.channel;
  if (message.language === "javascript") runJavaScript(message.code);
  else if (message.language === "html") previewHTML(message.code);
  else {
    stopAll();
    beginWorkerOutput();
    publishWorkerOutput("error", "Only JavaScript and HTML are supported.");
    publishWorkerOutput("complete", "Unsupported language", { passed: 0, failed: 0, testCount: 0 });
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !event.defaultPrevented) sendControl("escape");
});
window.addEventListener("pagehide", stopAll);
parentWindow.postMessage({ type: "osanwe-runner-ready", channel: startupChannel, networkIsolation: networkIsolationReady, htmlPreview: "source-only" }, "*");
</script>
</body>
</html>
